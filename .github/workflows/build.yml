name: Build Android APK from Zip

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Unzip project
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        echo "Unzipping $ZIP_FILE"
        mkdir project_folder
        unzip -q "$ZIP_FILE" -d project_folder

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find project path and build
      run: |
        cd project_folder
        GRADLEW_PATH=$(find . -name "gradlew" -maxdepth 3)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: 'project_folder/**/app/build/outputs/apk/debug/app-debug.apk'
